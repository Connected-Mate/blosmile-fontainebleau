name: Withdraw expired Blosmile preview

on:
  schedule:
    # UTC. Retry during the evening and the next day if a scheduled run is delayed.
    - cron: '30,47 17-20 17,18 10 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      withdraw: ${{ steps.pages-status.outputs.exists }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check the withdrawal window
        id: deadline
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const preview = JSON.parse(fs.readFileSync('data/preview.json', 'utf8'));
          if (typeof preview.enabled !== 'boolean') throw new Error('The preview enabled flag is invalid.');
          const deadline = Date.parse(preview.expiresAt);
          if (preview.enabled && !Number.isFinite(deadline)) throw new Error('The preview deadline is invalid.');
          const now = Date.now();
          const due = preview.enabled && now >= deadline && now < deadline + 48 * 60 * 60 * 1000;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `due=${due}\n`);
          console.log(due ? 'The preview is due for withdrawal.' : 'Outside the withdrawal window; nothing to publish.');
          NODE
      - name: Check whether Pages still exists
        id: pages-status
        if: steps.deadline.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            method: 'GET',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28'
            },
            signal: AbortSignal.timeout(30000)
          });
          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
            console.log('Pages has already been removed; do not enable or redeploy it.');
          } else {
            if (!response.ok) throw new Error(`Unable to check Pages: HTTP ${response.status}.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=true\n');
            console.log('Pages still exists; publish the withdrawal notice.');
          }
          NODE
      - name: Install dependencies
        if: steps.pages-status.outputs.exists == 'true'
        run: npm ci
      - name: Configure existing Pages
        if: steps.pages-status.outputs.exists == 'true'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: 'false'
      - name: Export the withdrawal notice only
        if: steps.pages-status.outputs.exists == 'true'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'NODE'
          import { releasePages } from './scripts/release-pages.mjs';
          const result = await releasePages();
          if (!result.expired || result.pages !== 0 || result.indexable) {
            throw new Error('Refusing to deploy anything except an expired preview notice.');
          }
          console.log('The preview routes and media have been removed from the artifact.');
          NODE
      - name: Upload the withdrawal files
        if: steps.pages-status.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.withdraw == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the withdrawal notice
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
